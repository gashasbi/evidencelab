
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install build

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify package identity
        run: python -m evidencelab --version

      - name: Run isolated regression tests
        run: python scripts/run_isolated_tests.py --timeout 180

      - name: Compile Python modules
        run: python -m compileall -q evidencelab scripts tests

      - name: Run reference audit
        run: python -m evidencelab research-audit --root examples/cwe-121

      - name: Validate ELS specification
        run: |
          python -m evidencelab evidence validate \
            --spec examples/evidence-dsl/cwe121-fixed-write-research-grade.els

      - name: Build source and wheel distributions
        if: matrix.python-version == '3.14'
        run: python -m build --sdist --wheel
