name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Verify package identity
        run: python -m evidencelab --version

      - name: Run isolated regression tests
        run: python scripts/run_isolated_tests.py --timeout 180

      - name: Compile Python modules
        run: python -m compileall -q evidencelab

      - name: Run reference audit
        run: python -m evidencelab research-audit --root examples/cwe-121

      - name: ELS validation smoke test
        run: |
          python -m evidencelab evidence validate \
            --spec examples/evidence-dsl/cwe121-fixed-write-research-grade.els
